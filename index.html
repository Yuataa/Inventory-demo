<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IT Raktár</title>
<style>
:root{
  --bg:#f5f6f8; --panel:#ffffff; --text:#1d2330; --muted:#667085; --line:#e3e6eb;
  --accent:#2f6fed; --accent-soft:#e8f0ff; --danger:#d92d20; --ok:#12a150; --warn:#c77700;
  --desk:#f3ead9; --desk-line:#cdb68c; --desk-person:#e6f4ea; --desk-person-line:#8cc5a0;
  --desk-shared:#e4ecfb; --desk-shared-line:#86a8e0; --rack:#3b3f46; --rack-line:#1f2226; --door:#9a7442;
  --grid:#e9ecf1; --shadow:0 1px 3px rgba(16,24,40,.08);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14171c; --panel:#1c2027; --text:#e6e8ec; --muted:#9aa3b2; --line:#2c323c;
    --accent:#6b9bff; --accent-soft:#1f2c47; --danger:#ff6b5e; --ok:#3ecf7a; --warn:#f0a73a;
    --desk:#3a3226; --desk-line:#7d6a48; --desk-person:#1f3628; --desk-person-line:#3f7a53;
    --desk-shared:#1e2a40; --desk-shared-line:#4a6aa0; --rack:#0d0f12; --rack-line:#4a515c; --door:#c49a5e;
    --grid:#232831; --shadow:0 1px 3px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --bg:#14171c; --panel:#1c2027; --text:#e6e8ec; --muted:#9aa3b2; --line:#2c323c;
  --accent:#6b9bff; --accent-soft:#1f2c47; --danger:#ff6b5e; --ok:#3ecf7a; --warn:#f0a73a;
  --desk:#3a3226; --desk-line:#7d6a48; --desk-person:#1f3628; --desk-person-line:#3f7a53;
  --desk-shared:#1e2a40; --desk-shared-line:#4a6aa0; --rack:#0d0f12; --rack-line:#4a515c; --door:#c49a5e;
  --grid:#232831; --shadow:0 1px 3px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--accent);text-decoration:none} a:hover{text-decoration:underline}
header{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--line);display:flex;gap:16px;align-items:center;padding:10px 16px;flex-wrap:wrap}
.brand{font-weight:700;font-size:17px;white-space:nowrap}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav a{padding:6px 10px;border-radius:6px;color:var(--muted)}
nav a.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
nav a:hover{text-decoration:none;color:var(--text)}
.search{position:relative;flex:1;min-width:220px;max-width:520px;margin-left:auto}
.search input{width:100%;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text);font-size:14px}
.results{position:absolute;top:100%;left:0;right:0;margin-top:4px;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.15);max-height:420px;overflow:auto;display:none}
.results.show{display:block}
.results a{display:block;padding:8px 12px;color:var(--text);border-bottom:1px solid var(--line)}
.results a:last-child{border-bottom:0}
.results a.act,.results a:hover{background:var(--accent-soft);text-decoration:none}
.results small{color:var(--muted);display:block}
.results .grp{padding:6px 12px;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);background:var(--bg)}
main{padding:20px 16px;max-width:1400px;margin:0 auto}
h1{font-size:22px;margin:0 0 4px} h2{font-size:16px;margin:24px 0 10px}
.sub{color:var(--muted);margin-bottom:16px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;box-shadow:var(--shadow)}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.stat .n{font-size:28px;font-weight:700} .stat .l{color:var(--muted)}
button,.btn{font:inherit;padding:7px 12px;border-radius:7px;border:1px solid var(--line);background:var(--panel);color:var(--text);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
button:hover,.btn:hover{border-color:var(--accent);text-decoration:none}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.danger{color:var(--danger)}
button.sm{padding:3px 8px;font-size:12px}
button:disabled{opacity:.5;cursor:wait}
input,select,textarea{font:inherit;padding:7px 9px;border:1px solid var(--line);border-radius:7px;background:var(--panel);color:var(--text)}
input[type=checkbox]{width:auto;padding:0}
textarea{min-height:60px;resize:vertical}
.tbl-wrap{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12px;color:var(--muted);font-weight:600;background:var(--bg);white-space:nowrap}
tr:last-child td{border-bottom:0}
.tag{font-family:ui-monospace,Consolas,monospace;font-weight:600}
.pill{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;background:var(--bg);border:1px solid var(--line);white-space:nowrap}
.pill.ok{color:var(--ok)} .pill.warn{color:var(--warn)} .pill.bad{color:var(--danger)}
.muted{color:var(--muted)}
.empty{padding:24px;text-align:center;color:var(--muted)}
dl.kv{display:grid;grid-template-columns:max-content 1fr;gap:6px 16px;margin:0}
dl.kv dt{color:var(--muted)} dl.kv dd{margin:0}
.loc-box{font-size:16px;padding:14px 16px;border-radius:10px;background:var(--accent-soft);border:1px solid var(--line);margin:12px 0}
.thumb{width:30px;height:30px;object-fit:contain;border-radius:5px;background:#fff;border:1px solid var(--line);vertical-align:middle}
.ico{display:inline-block;width:30px;text-align:center;font-size:18px;vertical-align:middle}
.photo{width:200px;height:200px;object-fit:contain;border-radius:10px;background:#fff;border:1px solid var(--line)}
.photo.none{display:flex;align-items:center;justify-content:center;font-size:72px;background:var(--bg)}
.asset-head{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.asset-head .card{flex:1;min-width:280px}
/* Room map */
.room-layout{display:grid;grid-template-columns:1fr 340px;gap:16px;align-items:start}
@media (max-width:900px){.room-layout{grid-template-columns:1fr}}
.map-wrap{overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px}
.map{position:relative;background-color:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:20px 20px;border:3px solid var(--muted);border-radius:4px}
.obj{position:absolute;cursor:grab;user-select:none;touch-action:none;font-size:11px;line-height:1.3}
.obj.sel{outline:3px solid var(--accent);outline-offset:2px;z-index:6}
.obj.flash{animation:flash 1s ease-in-out 3}
@keyframes flash{50%{outline:4px solid var(--warn);outline-offset:4px}}
.obj.dragging{cursor:grabbing;opacity:.85;z-index:10}
.obj.desk{background:var(--desk);border:2px solid var(--desk-line);border-radius:6px;padding:4px 6px;overflow:hidden}
.obj.desk.has-person{background:var(--desk-person);border-color:var(--desk-person-line)}
.obj.desk.shared{background:var(--desk-shared);border-color:var(--desk-shared-line)}
.obj.rack{background:var(--rack);border:2px solid var(--rack-line);border-radius:4px;padding:4px 6px;color:#e8eaee;overflow:hidden;
  background-image:repeating-linear-gradient(0deg,transparent 0 9px,rgba(255,255,255,.06) 9px 10px)}
.obj.rack .chip{background:#22262c;border-color:#555c66;color:#e8eaee}
.obj.door{background:repeating-linear-gradient(45deg,var(--door) 0 4px,transparent 4px 8px);border:2px solid var(--door);border-radius:2px;display:flex;align-items:center;justify-content:center;font-size:11px;z-index:3}
.obj.door span{background:var(--panel);border-radius:3px;padding:0 2px}
.obj.port{display:flex;align-items:center;justify-content:center;gap:3px;border-radius:11px;background:var(--panel);border:2px solid var(--muted);font-size:10px;font-weight:700;white-space:nowrap;z-index:4;color:var(--muted)}
.obj.port.patched{border-color:var(--ok);color:var(--ok)}
.obj.port.nolink{border-style:dashed}
.obj.port::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
.obj .dl{font-weight:700;font-size:12px}
.obj .dp{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.obj.rack .dp{color:#aab}
.chip{display:inline-block;margin:1px 2px 0 0;padding:0 4px;border-radius:4px;background:var(--panel);border:1px solid var(--line);font-family:ui-monospace,Consolas,monospace;font-size:10px;white-space:nowrap}
.side{position:sticky;top:calc(var(--hdr,64px) + 12px)}
.side .item{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
.side .item:last-child{border-bottom:0}
label.f{display:block;margin:10px 0 4px;color:var(--muted);font-size:12px}
label.f + input,label.f + select,label.f + textarea{width:100%}
label.cb{display:flex;align-items:center;gap:8px;margin:10px 0;cursor:pointer}
.legend{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:center;font-size:12px}
.legend i{display:inline-block;width:26px;height:14px;border-radius:3px;border:2px solid}
.warnbox{background:rgba(199,119,0,.12);border:1px solid var(--warn);color:var(--text);padding:8px 10px;border-radius:8px;margin-top:8px;font-size:12px}
.toolbar{display:flex;gap:6px;flex-wrap:wrap}
/* switch ports */
.ports{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:6px}
.pc{border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-size:12px;background:var(--panel)}
.pc b{font-family:ui-monospace,Consolas,monospace}
.pc.used{border-color:var(--muted);border-style:dashed}
.pc.patched{border-color:var(--ok);border-style:solid;background:rgba(18,161,80,.07)}
.pc.conflict{border-color:var(--danger);border-style:solid}
/* dialog */
dialog{border:1px solid var(--line);border-radius:12px;padding:0;background:var(--panel);color:var(--text);width:min(560px,calc(100vw - 32px));max-height:92vh;box-shadow:0 20px 60px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(0,0,0,.4)}
dialog form{padding:20px}
dialog h3{margin:0 0 8px}
dialog .actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;position:sticky;bottom:-20px;background:var(--panel);padding:10px 0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.two input,.two select{width:100%}
.room-cards .card{cursor:pointer} .room-cards .card:hover{border-color:var(--accent)}
.mini-map{position:relative;height:110px;background:var(--bg);border:1px solid var(--line);border-radius:6px;margin-top:10px;overflow:hidden}
.mini-map div{position:absolute;background:var(--desk-line);border-radius:2px}
.mini-map div.rack{background:var(--rack)} .mini-map div.door{background:var(--door)} .mini-map div.port{background:var(--ok);border-radius:50%}
.mini-map div.floorbox{background:var(--accent)}
.obj.floorbox{display:flex;align-items:center;justify-content:center;background:var(--panel);border:2px solid var(--accent);border-radius:3px;color:var(--accent);font-size:10px;font-weight:700;white-space:nowrap;z-index:4;
  background-image:linear-gradient(135deg,transparent 46%,var(--accent-soft) 46% 54%,transparent 54%)}
/* bulk selection */
.bulkbar{position:sticky;top:calc(var(--hdr,64px) + 8px);z-index:15;display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--accent-soft);border:1px solid var(--accent);border-radius:10px;padding:8px 12px;margin-bottom:12px;box-shadow:var(--shadow)}
.bulkbar[hidden]{display:none}
td.sel,th.sel{width:34px;padding-right:0}
td.sel input,th.sel input{width:16px;height:16px;cursor:pointer;vertical-align:middle}
tr.picked td{background:var(--accent-soft)}
.checklist{max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:4px 10px}
.checklist label{display:flex;gap:8px;align-items:center;padding:5px 0;border-bottom:1px solid var(--line);cursor:pointer}
.checklist label:last-child{border-bottom:0}
/* guided tour */
#tour{position:fixed;inset:auto;left:50%;bottom:24px;transform:translateX(-50%);margin:0;z-index:1000;width:min(720px,calc(100vw - 32px));height:auto;
  background:#111827;color:#fff;border:0;border-radius:14px;padding:16px 20px 12px;box-shadow:0 12px 40px rgba(0,0,0,.35);font-size:15px;line-height:1.45}
#tour h4{margin:2px 0 4px;font-size:19px}
#tour .tn{font-size:11px;color:#9aa3b2;text-transform:uppercase;letter-spacing:.06em}
#tour .tp{height:4px;background:rgba(255,255,255,.18);border-radius:2px;margin-top:12px;overflow:hidden}
#tour .tp i{display:block;height:100%;background:#6b9bff;width:0}
#tour .tc{display:flex;gap:6px;align-items:center;margin-top:8px;font-size:11px;color:#9aa3b2;flex-wrap:wrap}
#tour .tc button{background:rgba(255,255,255,.12);border:0;color:#fff;padding:3px 10px;font-size:12px}
.tour-hl{outline:4px solid #f5a524 !important;outline-offset:4px;animation:tourpulse 1.4s ease-in-out infinite}
@keyframes tourpulse{50%{outline-color:rgba(245,165,36,.3)}}
#tourDoc{position:fixed;left:24px;right:24px;top:24px;bottom:190px;z-index:999;background:#fff;border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.45);overflow:hidden}
#tourDoc iframe{width:100%;height:100%;border:0}
</style>
</head>
<body>
<header>
  <div class="brand">🗄️ IT Raktár</div>
  <nav id="nav">
    <a href="#/" data-r="">Áttekintés</a>
    <a href="#/assets" data-r="assets">Eszközök</a>
    <a href="#/people" data-r="people">Emberek</a>
    <a href="#/rooms" data-r="rooms">Helyiségek / térkép</a>
    <a href="#/network" data-r="network">Hálózat</a>
    <a href="#/docs" data-r="docs">Dokumentumok</a>
    <a href="#/log" data-r="log">Napló</a>
    <a href="#/settings" data-r="settings">Adatok</a>
  </nav>
  <button class="primary" onclick="startTour()" title="Automatikus bemutató a funkciókról">▶ Bemutató</button>
  <div class="search">
    <input id="q" type="search" placeholder="Keresés: név, eszköz ID, sorozatszám, asztal, hálózati pont… (Ctrl+K)" autocomplete="off">
    <div id="results" class="results"></div>
  </div>
</header>
<main id="view"></main>
<dialog id="dlg"><form method="dialog" id="dlgForm"></form></dialog>
<input type="file" id="importFile" accept=".json,application/json" hidden>

<script>
'use strict';
const KEY = 'itraktar_v1';
const TOUR_BACKUP = KEY + '_tour_backup';
const TYPES = {
  monitor:  {label:'Monitor',           icon:'🖥️', prefix:'MON'},
  pc:       {label:'Számítógép',        icon:'💻', prefix:'PC'},
  headset:  {label:'Fejhallgató',       icon:'🎧', prefix:'HS'},
  dock:     {label:'Dokkoló',           icon:'🔌', prefix:'DOK'},
  keyboard: {label:'Billentyűzet/egér', icon:'⌨️', prefix:'BE'},
  phone:    {label:'Telefon',           icon:'📱', prefix:'TEL'},
  printer:  {label:'Nyomtató',          icon:'🖨️', prefix:'NY'},
  switch:   {label:'Switch',            icon:'🔀', prefix:'SW',  net:true},
  router:   {label:'Router / tűzfal',   icon:'🛡️', prefix:'RT',  net:true},
  patch:    {label:'Patch panel',       icon:'🧷', prefix:'PP',  net:true},
  server:   {label:'Szerver',           icon:'🗄️', prefix:'SRV'},
  ups:      {label:'Szünetmentes (UPS)',icon:'🔋', prefix:'UPS'},
  other:    {label:'Egyéb',             icon:'📦', prefix:'EGY'},
};
const STATUS = {
  ok:      {label:'Működik',       cls:'ok'},
  repair:  {label:'Javítás alatt', cls:'warn'},
  lost:    {label:'Elveszett',     cls:'bad'},
  retired: {label:'Selejtezett',   cls:'bad'},
};
const MODES = {iroda:'Irodában', otthon:'Otthonról', hibrid:'Hibrid'};
const ROOM_KINDS = {office:'🏢 Iroda', server:'🗄️ Szerverszoba', storage:'📦 Raktárhelyiség', meeting:'👥 Tárgyaló'};
// Map objects: desks & racks can hold assets (stored in db.desks); doors & network points are db.items
const OBJ = {
  desk: {label:'Asztal',         w:160, h:90},
  rack: {label:'Rack',           w:90,  h:150},
  door: {label:'Ajtó',           w:70,  h:12},
  port: {label:'Hálózati pont',  w:56,  h:22},
  floorbox: {label:'Padlódoboz / elosztó', w:70, h:26},
};
const DOC_KINDS = {
  out: {label:'Átadás-átvételi', title:'Eszköz átadás-átvételi jegyzőkönyv', prefix:'ÁA'},
  in:  {label:'Visszavételi',    title:'Eszköz visszavételi jegyzőkönyv',    prefix:'VV'},
  swap:{label:'Eszközcsere',     title:'Eszközcsere jegyzőkönyv',            prefix:'CS'},
};
const SWAP_REASONS = {broken:'Meghibásodás', damaged:'Sérülés', lost:'Elvesztés / lopás', upgrade:'Fejlesztés (újabbra csere)', other:'Egyéb'};
const DEFAULT_SETTINGS = {
  company:'', address:'', handler:'',
  outText:'Alulírott átvevő aláírásommal igazolom, hogy a fent felsorolt eszközöket hiánytalanul, működőképes állapotban átvettem. ' +
    'Vállalom, hogy az eszközöket rendeltetésszerűen, munkavégzés céljára használom, megóvásukról gondoskodom, és az esetleges meghibásodást, ' +
    'elvesztést vagy eltulajdonítást haladéktalanul jelzem az IT részére. Tudomásul veszem, hogy munkaviszonyom megszűnésekor, illetve a munkáltató ' +
    'kérésére az eszközöket hiánytalanul visszaszolgáltatom, és az általam okozott kárért a munkajogi szabályok szerint felelősséggel tartozom.',
  inText:'Alulírottak igazolják, hogy a fent felsorolt eszközök visszaszolgáltatása a mai napon megtörtént. Az eszközök visszavételkori ' +
    'állapotára vonatkozó észrevételek a táblázatban kerültek rögzítésre. A visszaadott eszközökért a munkavállaló felelőssége megszűnik.',
  swapText:'Alulírottak igazolják, hogy a fenti lecserélt eszköz visszavétele, és helyette a csereeszköz átadása a mai napon megtörtént. ' +
    'A csereeszközre a munkavállaló az eredeti átadás-átvételi jegyzőkönyvben vállalt felelősséggel azonos módon felel; ' +
    'a lecserélt eszközért való felelőssége a visszavétellel megszűnik.',
};

// Signed documents can be large PDFs, so they live in IndexedDB instead of localStorage
const idb = (() => {
  let p;
  const open = () => p ||= new Promise((res, rej) => {
    const r = indexedDB.open('itraktar_files', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('files');
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
  const tx = async (mode, fn) => {
    const d = await open();
    return new Promise((res, rej) => {
      const t = d.transaction('files', mode), req = fn(t.objectStore('files'));
      t.oncomplete = () => res(req && req.result); t.onerror = () => rej(t.error);
    });
  };
  return {
    get: k => tx('readonly', s => s.get(k)),
    put: (k, v) => tx('readwrite', s => s.put(v, k)),
    del: k => tx('readwrite', s => s.delete(k)),
    clear: () => tx('readwrite', s => s.clear()),
  };
})();
const blobToDataURL = b => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(r.error); r.readAsDataURL(b); });

// ---------- storage ----------
const uid = () => Math.random().toString(36).slice(2, 10);
restoreTourBackup();
let db = load();
// the tour runs on demo data; put the real data back (also after a tour that was cut short by closing the tab)
function restoreTourBackup(){
  try {
    const b = localStorage.getItem(TOUR_BACKUP);
    if (b === null) return;
    if (b === '__none__') localStorage.removeItem(KEY); else localStorage.setItem(KEY, b);
    localStorage.removeItem(TOUR_BACKUP);
  } catch(e) {}
}
function load(){
  try { const s = localStorage.getItem(KEY); if (s) return migrate(JSON.parse(s)); } catch(e) {}
  const d = demo(); persist(d); return d;
}
// bring data saved by older versions up to date
function migrate(d){
  d.people ||= []; d.rooms ||= []; d.desks ||= []; d.assets ||= []; d.log ||= []; d.items ||= []; d.images ||= {}; d.docs ||= []; d.swaps ||= [];
  d.settings = {...DEFAULT_SETTINGS, ...(d.settings || {})};
  for (const r of d.rooms) r.kind ||= 'office';
  for (const k of d.desks){ k.kind ||= 'desk'; if (k.shared === undefined) k.shared = false; }
  return d;
}

function warranty(a){
  if (!a.warrantyUntil) return {cls:'', text:'–', days:null};
  const days = Math.ceil((new Date(a.warrantyUntil + 'T23:59:59') - Date.now()) / 864e5);
  if (days < 0) return {cls:'bad', text:'Lejárt (' + fmtDate(a.warrantyUntil) + ')', days};
  if (days <= 60) return {cls:'warn', text:`${days} nap múlva lejár`, days};
  return {cls:'ok', text:fmtDate(a.warrantyUntil) + '-ig', days};
}
const warrantyPill = a => { const w = warranty(a); return w.days === null ? '<span class="muted">–</span>' : `<span class="pill ${w.cls}">${w.text}</span>`; };

function deskOwnerText(k){

function nextTag(type){
  const pre = typeOf(type).prefix + '-';
  let max = 0;
  for (const a of db.assets) if (a.tag.startsWith(pre)){ const n = parseInt(a.tag.slice(pre.length), 10); if (n > max) max = n; }
  return pre + String(max + 1).padStart(4, '0');
}

function openDialog(html, onSubmit){

    if (onSubmit(data, form) !== false) dlg.close();
  };
  dlg.showModal();
  const first = form.querySelector('input,select,textarea'); if (first) first.focus();
}

// Shrink an uploaded photo to a small JPEG thumbnail so it fits into browser storage
function resizeImage(file, max = 240){
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(img.width * s)); c.height = Math.max(1, Math.round(img.height * s));
      const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
      ctx.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', 0.82));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('A fájl nem olvasható képként.')); };
    img.src = url;
  });
}

function assignAssetDialog(h, title){
  const key = holderKey(h);
  const candidates = sortHu(db.assets.filter(a => holderKey(a.holder) !== key && a.status !== 'retired'), a => (a.holder.kind === 'storage' ? '0' : '1') + a.tag);
  if (!candidates.length){ alert('Nincs áthelyezhető eszköz. Hozz létre egy újat!'); return; }
  openDialog(`

    ${dlgActions('Áthelyezés ide')}`,

// ---------- bulk selection ----------
const selected = new Set();
function updateBulk(){
  const boxes = [...document.querySelectorAll('.selbox')];
  boxes.forEach(b => b.closest('tr').classList.toggle('picked', b.checked));
  const all = $('#selAll');
  if (all){ all.checked = boxes.length > 0 && boxes.every(b => b.checked); all.indeterminate = !all.checked && boxes.some(b => b.checked); }
  const bar = $('#bulkbar');
  if (bar){
    bar.hidden = !selected.size;
    const hidden = [...selected].filter(id => !boxes.some(b => b.dataset.id === id)).length;
    bar.querySelectorAll('.bulkCount').forEach(s => s.textContent = selected.size + (hidden ? ` (${hidden} nem látszik a szűrés miatt)` : ''));
  }
}
function bulkMove(hs){
  if (!hs){ alert('Válaszd ki, hova vagy kinek kerüljenek az eszközök.'); return; }
  const list = [...selected].map(asset).filter(Boolean);
  if (!list.length) return;
  const h = parseHolder(hs);
  // who gave things back – used to offer a return protocol
  const from = new Map();
  for (const a of list) if (a.holder.kind === 'person' && !(h.kind === 'person' && h.id === a.holder.id))
    from.set(a.holder.id, [...(from.get(a.holder.id) || []), a.id]);
  for (const a of list) setHolder(a, h);
  selected.clear(); save(); render();
  if (h.kind === 'person'){
    if (confirm(`${list.length} eszköz hozzárendelve: ${person(h.id).name}.\n\nKészítsek átadás-átvételi jegyzőkönyvet ezekről?`)) docDialog(h.id, 'out', list.map(a => a.id));
  } else if (from.size === 1){
    const [pid, ids] = [...from][0];
    if (confirm(`${ids.length} eszköz visszavéve tőle: ${person(pid).name}.\n\nKészítsek visszavételi jegyzőkönyvet?`)) docDialog(pid, 'in', ids);
  }
}
function bulkStatus(){
  const s = $('#bulkStatus').value;
  if (!s){ alert('Válassz állapotot.'); return; }
  for (const a of [...selected].map(asset).filter(Boolean)) if (a.status !== s){
    log(a.id, `Állapot: ${STATUS[a.status].label} → ${STATUS[s].label}`); a.status = s;
  }
  selected.clear(); save(); render();
}
function returnAll(pid){
  const ids = personAssets(pid).direct.map(a => a.id);
  if (!ids.length || !confirm(`Mind a(z) ${ids.length} eszköz visszakerül a raktárba. Folytatod?`)) return;
  selected.clear(); ids.forEach(id => selected.add(id));
  bulkMove('storage');
}
document.getElementById('view').addEventListener('change', e => {
  const t = e.target;
  if (t.classList.contains('selbox')){ t.checked ? selected.add(t.dataset.id) : selected.delete(t.dataset.id); updateBulk(); }
  else if (t.id === 'selAll') document.querySelectorAll('.selbox').forEach(b => {
    b.checked = t.checked; t.checked ? selected.add(b.dataset.id) : selected.delete(b.dataset.id); updateBulk();
  });
});

function switchPorts(a){
  const pts = netPorts().filter(p => p.switchId === a.id);
  const n = Math.max(a.ports || 0, ...pts.map(p => +p.switchPort || 0));
  if (!n) return `<h2>Portok</h2><div class="empty">Add meg a portok számát a Szerkesztésnél, és a padlóban lévő hálózati pontokat a térképen rendeld ehhez az eszközhöz.</div>`;
  const cells = [];
  for (let i = 1; i <= n; i++){
    const on = pts.filter(p => +p.switchPort === i);
    const cls = on.length > 1 ? 'conflict' : on.length ? (on[0].patched ? 'patched' : 'used') : '';
    cells.push(`<div class="pc ${cls}"><b>${i}.</b> ${on.length ? on.map(p => `<a href="#/room/${p.roomId}/${p.id}">${esc(p.label)}</a>`).join(', ') + `<br><small class="muted">${on.length > 1 ? '⚠️ ütközés' : on[0].patched ? '✔ bepatchelve' : 'nincs bepatchelve'} · ${esc((room(on[0].roomId) || {}).name || '')}</small>` : '<span class="muted">szabad</span>'}</div>`);
  }
  const unnum = pts.filter(p => !p.switchPort);
  return `<h2>Portok (${pts.filter(p => p.patched).length} bepatchelve / ${n})</h2>
    <div class="ports">${cells.join('')}</div>
    ${unnum.length ? `<p class="muted">Port szám nélkül hozzárendelve: ${unnum.map(p => `<a href="#/room/${p.roomId}/${p.id}">${esc(p.label)}</a>`).join(', ')}</p>` : ''}`;
}

function deleteAsset(id){
  const a = asset(id);

  for (const p of netPorts()) if (p.switchId === id){ p.switchId = null; p.switchPort = null; p.patched = false; }
  db.assets = db.assets.filter(x => x.id !== id); log(id, `Törölve: ${a.tag}`); save(); location.hash = '#/assets';
}

function toStorage(id){ setHolder(asset(id), {kind:'storage'}); save(); render(); }
function deletePerson(id){
  const p = person(id), pa = personAssets(id);
  if (!confirm(`Biztosan törlöd: ${p.name}?\nA nála lévő ${pa.direct.length} eszköz a raktárba kerül, az asztala gazdátlan lesz.\nA jegyzőkönyvei megmaradnak a Dokumentumok között.`)) return;
  for (const a of pa.direct) setHolder(a, {kind:'storage'});
  for (const k of pa.desks) k.personId = null;
  db.people = db.people.filter(x => x.id !== id); save(); location.hash = '#/people';
}

// ---------- handover documents ----------
// assets the person holds that are not on any handover protocol made since they got them
function uncovered(pid){
  return personAssets(pid).direct.filter(a => !db.docs.some(d => d.personId === pid && (d.kind === 'out' || d.kind === 'swap')
    && d.createdAt >= (a.assignedAt || 0) - 60000 && d.items.some(i => i.assetId === a.id && i.role !== 'in')));
}
// swap that later replaced this asset (used to annotate older protocols)
const replacedAfter = (assetId, ts) => db.swaps.find(s => s.oldId === assetId && s.ts >= ts);
const snapAsset = a => ({assetId:a.id, tag:a.tag, type:a.type, model:a.model, serial:a.serial, assignedAt:a.assignedAt || null});
function holderPerson(h){
  if (h.kind === 'person') return h.id;
  if (h.kind === 'desk'){ const k = desk(h.id); return k && k.personId || null; }
  return null;
}
function swapDialog(oldId){
  const old = asset(oldId);
  if (old.holder.kind === 'storage'){ alert('Raktárban lévő eszközt nem kell cserélni – csere csak kiadott eszköznél van.'); return; }
  const cands = sortHu(db.assets.filter(a => a.holder.kind === 'storage' && a.status === 'ok'), a => (a.type === old.type ? '0' : '1') + a.tag);
  if (!cands.length){ alert('Nincs működő eszköz a raktárban. Előbb vegyél fel egy új eszközt a raktárba, utána végezd el a cserét.'); return; }
  const owner = holderPerson(old.holder), hasSame = cands.some(a => a.type === old.type);
  openDialog(`
    <h3>🔁 Eszközcsere</h3>
    <div class="loc-box" style="font-size:14px;margin-top:4px">Lecserélendő: ${assetIcon(old)} <b class="tag">${esc(old.tag)}</b> · ${typeLabel(old.type)} · ${esc(old.model)}<br>
      <small class="muted">${esc(holderText(old.holder))}</small></div>
    <div class="two">
      <div><label class="f">Csere oka</label><select name="reason" id="swReason">${Object.entries(SWAP_REASONS).map(([k, v]) => `<option value="${k}">${v}</option>`).join('')}</select></div>
      <div><label class="f">A lecserélt eszköz új állapota</label><select name="oldStatus" id="swStatus">${Object.entries(STATUS).map(([k, s]) => `<option value="${k}"${k === 'repair' ? ' selected' : ''}>${s.label}</option>`).join('')}</select></div>
    </div>
    <label class="f">Hiba leírása / megjegyzés</label><textarea name="note" style="width:100%" placeholder="pl. nem kapcsol be, csíkos a kép"></textarea>
    <label class="f">Csereeszköz (működő, raktáron lévő)</label>
    <label class="cb" style="margin:4px 0"><input type="checkbox" id="swSame"${hasSame ? ' checked' : ''}> Csak azonos típus (${typeLabel(old.type)})</label>
    <select name="newId" id="swSel" size="7" required style="width:100%">${cands.map(a =>
      `<option value="${a.id}" data-type="${a.type}">${typeIcon(a.type)} ${esc(a.tag)} · ${esc(a.model)} · ${esc(a.serial)}</option>`).join('')}</select>
    <div class="two">
      <div><label class="f">Dátum</label><input type="date" name="date" required value="${new Date().toISOString().slice(0, 10)}"></div>
      <div><label class="f">Átadó (IT) neve</label><input name="handler" value="${esc(db.settings.handler)}"></div>
    </div>
    ${owner ? `<label class="cb"><input type="checkbox" name="mkdoc" checked> Csere jegyzőkönyv készítése – ${esc(person(owner).name)}</label>` : '<p class="muted" style="font-size:12px">Közös / gazdátlan helyen lévő eszköz – jegyzőkönyv nem készül, a csere a nyilvántartásban rögzül.</p>'}
    ${dlgActions('Csere végrehajtása')}`,
    data => {
      const nw = asset(data.newId);
      if (!nw){ alert('Válaszd ki a csereeszközt.'); return false; }
      const where = holderText(old.holder), h = old.holder, reason = SWAP_REASONS[data.reason];
      setHolder(nw, h);
      setHolder(old, {kind:'storage'});
      if (old.status !== data.oldStatus){ log(old.id, `Állapot: ${STATUS[old.status].label} → ${STATUS[data.oldStatus].label}`); old.status = data.oldStatus; }
      log(old.id, `🔁 Lecserélve erre: ${nw.tag} – ${reason}${data.note.trim() ? ': ' + data.note.trim() : ''}`);
      log(nw.id, `🔁 Csereeszközként kiadva ${old.tag} helyett (${where})`);
      const sw = {id:uid(), ts:Date.now(), date:data.date, oldId:old.id, newId:nw.id, oldTag:old.tag, newTag:nw.tag,
        reason, note:data.note.trim(), oldStatus:data.oldStatus, where, personId:owner, docId:null};
      db.swaps.unshift(sw);
      let doc = null;
      if (owner && data.mkdoc){
        doc = {id:uid(), no:nextDocNo('swap'), kind:'swap', personId:owner, personName:person(owner).name, date:data.date,
          handler:data.handler.trim(), reason, note:data.note.trim(), createdAt:Date.now(), fileId:null, swapId:sw.id,
          items:[{...snapAsset(nw), role:'out'}, {...snapAsset(old), role:'in'}]};
        sw.docId = doc.id; db.docs.unshift(doc);
        if (doc.handler) db.settings.handler = doc.handler;
      }
      save(); render();
      if (doc) printDoc(doc.id);
    });
  const filt = () => {
    const same = $('#swSame').checked, sel = $('#swSel');
    for (const o of sel.options) o.hidden = same && o.dataset.type !== old.type;
    // keep a visible device selected so the swap can go ahead right away
    if (!sel.selectedOptions[0] || sel.selectedOptions[0].hidden){ const first = [...sel.options].find(o => !o.hidden); if (first) sel.value = first.value; }
  };
  $('#swSame').addEventListener('change', filt); filt();
  $('#swReason').addEventListener('change', e => { $('#swStatus').value = {lost:'lost', upgrade:'ok'}[e.target.value] || 'repair'; });
}
function swapTable(list, opts = {}){

      <td>${d ? `<span class="tag">${esc(d.no)}</span> ${d.fileId ? '<span class="pill ok">✔</span>' : '<span class="pill warn">aláírásra vár</span>'}` : '<span class="muted">–</span>'}</td></tr>`;
  }).join('')}</tbody></table></div>`;
}
function docBadges(pid){
  const unc = uncovered(pid).length, wait = db.docs.filter(d => d.personId === pid && !d.fileId).length;
  return [unc && `<span class="pill bad" title="Eszköz jegyzőkönyv nélkül">${unc} jkv. nélkül</span>`,
    wait && `<span class="pill warn">${wait} aláírásra vár</span>`].filter(Boolean).join(' ') || '<span class="muted">–</span>';

function nextDocNo(kind){
  const pre = `${DOC_KINDS[kind].prefix}-${new Date().getFullYear()}-`;
  let m = 0;
  for (const d of db.docs) if (d.no.startsWith(pre)) m = Math.max(m, parseInt(d.no.slice(pre.length), 10) || 0);
  return pre + String(m + 1).padStart(4, '0');
}
function docChips(d){
  const chip = i => asset(i.assetId) ? `<a class="chip" href="#/asset/${i.assetId}">${typeIcon(i.type)} ${esc(i.tag)}</a>` : `<span class="chip">${esc(i.tag)}</span>`;
  if (d.kind === 'swap'){
    const o = d.items.find(i => i.role === 'in'), n = d.items.find(i => i.role === 'out');
    return `<s>${o ? chip(o) : ''}</s> ➜ ${n ? chip(n) : ''}`;
  }
  // items that were swapped out after this protocol show what replaced them
  return d.items.map(i => {
    const s = d.kind === 'out' && replacedAfter(i.assetId, d.createdAt);
    return s ? `<span title="${esc(`Lecserélve ${fmtDate(s.date)}: ${s.reason}`)}"><s>${chip(i)}</s> 🔁 <a class="chip" href="#/asset/${s.newId}">${esc(s.newTag)}</a></span>` : chip(i);
  }).join(' ');
}

function docDialog(pid, kind, preIds){

    });

function printDoc(id){
  const html = docHtml(byId(db.docs, id));
  if (tour.on){ showTourDoc(html); return; }
  const w = window.open('', '_blank');
  if (w){ w.document.open(); w.document.write(html); w.document.close(); return; }
  // popup blocked: print straight from a hidden frame
  const f = document.createElement('iframe');
  f.style.cssText = 'position:fixed;width:0;height:0;border:0';
  document.body.appendChild(f);
  f.contentDocument.open(); f.contentDocument.write(html); f.contentDocument.close();
  setTimeout(() => { f.contentWindow.print(); setTimeout(() => f.remove(), 60000); }, 300);
}
function uploadSigned(docId){
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'application/pdf,image/*';
  inp.onchange = async () => {
    const f = inp.files[0], d = byId(db.docs, docId);
    if (!f || !d) return;
    try {
      const id = uid();
      await idb.put(id, {name:f.name, type:f.type, blob:f});
      if (d.fileId) await idb.del(d.fileId);
      Object.assign(d, {fileId:id, fileName:f.name, fileSize:f.size, signedAt:Date.now()});
      for (const i of d.items) if (asset(i.assetId)) log(i.assetId, `${DOC_KINDS[d.kind].label} jegyzőkönyv aláírva feltöltve (${d.no})`);
      save(); render();
    } catch(e){ alert('Nem sikerült menteni a fájlt: ' + e.message); }
  };
  inp.click();
}
async function openDocFile(docId, download){
  const d = byId(db.docs, docId);
  const w = download ? null : window.open('', '_blank');
  const rec = d && d.fileId && await idb.get(d.fileId);
  if (!rec){ if (w) w.close(); alert('Az aláírt fájl nem található ebben a böngészőben (pl. más gépen töltötték fel, vagy a mentés nem tartalmazta).'); return; }
  const url = URL.createObjectURL(rec.blob);
  if (w) w.location.href = url;
  else { const a = document.createElement('a'); a.href = url; a.download = rec.name; document.body.appendChild(a); a.click(); a.remove(); }
  setTimeout(() => URL.revokeObjectURL(url), 120000);
}

function bindRoom(roomId, selId){
  const r = room(roomId), map = $('#map');
  const snap = v => Math.round(v / 10) * 10;
  map.querySelectorAll('.obj').forEach(el => {
    el.addEventListener('pointerdown', e => {
      if (e.button !== 0) return;
      const o = findObj(el.dataset.id), sx = e.clientX, sy = e.clientY, ox = o.x, oy = o.y;
      let moved = false;
      el.setPointerCapture(e.pointerId);
      const mv = ev => {
        const dx = ev.clientX - sx, dy = ev.clientY - sy;
        if (!moved && Math.abs(dx) + Math.abs(dy) < 4) return;
        moved = true; el.classList.add('dragging');
        o.x = Math.max(0, Math.min(r.w - o.w, snap(ox + dx)));
        o.y = Math.max(0, Math.min(r.h - o.h, snap(oy + dy)));
        el.style.left = o.x + 'px'; el.style.top = o.y + 'px';
      };
      const up = () => {
        el.removeEventListener('pointermove', mv); el.removeEventListener('pointerup', up);
        el.classList.remove('dragging');
        if (moved) save();
        selectObj(o);
      };
      el.addEventListener('pointermove', mv); el.addEventListener('pointerup', up);
    });
  });
  const o = selId && findObj(selId);
  if (!o) return;
  // side panel fields: data-f names the property they edit
  document.querySelectorAll('.side [data-f]').forEach(el => el.addEventListener('change', () => {
    const f = el.dataset.f;
    let v = el.type === 'checkbox' ? el.checked : el.value;
    if (f === 'sockets') o.sockets = +v || null;
    else if (f === 'boxId') o.boxId = v || null;
    else if (f === 'owner'){ o.shared = v === 'shared'; o.personId = v && v !== 'shared' ? v : null; }
    else if (f === 'w' || f === 'h'){ o[f] = Math.max(10, +v || o[f]); clampObj(o); }
    else if (f === 'label'){ o.label = String(v).trim() || o.label; }
    else if (f === 'switchId'){
      const old = o.switchId && asset(o.switchId);
      o.switchId = v || null; if (!o.switchId){ o.switchPort = null; o.patched = false; }
      if (old) log(old.id, `${o.label} lekötve a(z) ${o.switchPort || '?'}. portról`);
      if (o.switchId) log(o.switchId, `${o.label} hozzárendelve`);
    }
    else if (f === 'switchPort'){ o.switchPort = +v || null; if (o.switchId) log(o.switchId, `${o.label} → ${o.switchPort || '?'}. port`); }
    else if (f === 'patched'){ o.patched = v; if (o.switchId) log(o.switchId, `${o.switchPort || '?'}. port (${o.label}): ${v ? 'bepatchelve' : 'patch eltávolítva'}`); }
    else o[f] = v;
    save(); render();
  }));
}
function selectObj(o){

// first free grid spot so new objects don't stack on top of each other
function findSpot(r, w, h){
  const os = roomObjs(r.id);
  for (let y = 20; y <= r.h - h; y += 20) for (let x = 20; x <= r.w - w; x += 20)
    if (!os.some(k => x < k.x + k.w + 10 && x + w + 10 > k.x && y < k.y + k.h + 10 && y + h + 10 > k.y)) return {x, y};
  return {x:0, y:0};
}
function addObj(roomId, kind, boxId){
  const r = room(roomId), def = OBJ[kind], same = roomObjs(roomId).filter(o => o.kind === kind).length + 1;
  const box = boxId && item(boxId);
  let {x, y} = kind === 'door' ? {x: Math.max(0, r.w - def.w - 40), y: 0} : findSpot(r, def.w, def.h);
  if (box){
    // stack new sockets in two columns right under their floor box
    const n = boxPorts(box.id).length;
    x = box.x + (n % 2) * (def.w + 6); y = box.y + box.h + 6 + Math.floor(n / 2) * (def.h + 4);
  }
  const o = {id:uid(), roomId, kind, x, y, w:def.w, h:def.h};
  if (kind === 'desk') Object.assign(o, {label:'Asztal ' + same, personId:null, shared:false, sharedNote:''});
  if (kind === 'rack') Object.assign(o, {label:'Rack ' + same, personId:null, shared:false});
  if (kind === 'door') o.label = same === 1 ? 'Bejárat' : 'Ajtó ' + same;
  if (kind === 'port') Object.assign(o, {label: roomPrefix(r) + '-' + String(same).padStart(2, '0'), switchId:null, switchPort:null, patched:false, note:'', boxId: box ? box.id : null});
  if (kind === 'floorbox') Object.assign(o, {label:'PD-' + String(same).padStart(2, '0'), sockets:4, note:''});
  (kind === 'desk' || kind === 'rack' ? db.desks : db.items).push(o);
  clampObj(o);

}
function rotateObj(id){ const o = findObj(id); [o.w, o.h] = [o.h, o.w]; clampObj(o); save(); render(); }
function deleteObj(id){
  const o = findObj(id), name = `${OBJ[o.kind].label} „${o.label}”`;

}

  const r = room(id), ks = db.desks.filter(k => k.roomId === id);
  const as = db.assets.filter(a => a.holder.kind === 'desk' && ks.some(k => k.id === a.holder.id));

function parseType(v, model){
  const n = norm(v);
  for (const [k, t] of Object.entries(TYPES)) if (n && (n === k || n === norm(t.label) || n === norm(t.prefix))) return k;
  const hay = norm(v + ' ' + model);
  for (const [k, ws] of TYPE_WORDS) if (ws.some(w => hay.includes(norm(w)))) return k;
  return 'other';
}
function parseStatus(v){
  const n = norm(v);
  if (!n) return '';
  if (/javit|repair|broken|hibas/.test(n)) return 'repair';
  if (/lost|stolen|elvesz|lopott/.test(n)) return 'lost';
  if (/archiv|retire|selejt|dispos/.test(n)) return 'retired';

}
const isoLocal = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
function toISO(v){
  if (v instanceof Date && !isNaN(v)) return isoLocal(v);
  if (typeof v === 'number' && v > 20000 && v < 80000) return isoLocal(new Date(Math.round((v - 25569) * 864e5)));
  const s = String(v ?? '').trim();
  let m = s.match(/^(\d{4})[.\-/ ]+(\d{1,2})[.\-/ ]+(\d{1,2})/);
  if (m) return `${m[1]}-${m[2].padStart(2, '0')}-${m[3].padStart(2, '0')}`;
  m = s.match(/^(\d{1,2})[.\-/](\d{1,2})[.\-/](\d{4})/);
  if (m){ const [a, b] = +m[1] > 12 ? [m[2], m[1]] : [m[1], m[2]]; return `${m[3]}-${a.padStart(2, '0')}-${b.padStart(2, '0')}`; }
  return '';
}
function parseCSV(text){
  text = text.replace(/^﻿/, '');
  const first = text.split(/\r?\n/)[0];
  const delim = [';', '\t', ','].map(d => [d, first.split(d).length]).sort((a, b) => b[1] - a[1])[0][0];
  const rows = []; let row = [], cur = '', q = false;
  for (let i = 0; i < text.length; i++){
    const c = text[i];
    if (q){ if (c === '"'){ if (text[i + 1] === '"'){ cur += '"'; i++; } else q = false; } else cur += c; }
    else if (c === '"') q = true;
    else if (c === delim){ row.push(cur); cur = ''; }
    else if (c === '\n'){ row.push(cur); rows.push(row); row = []; cur = ''; }
    else if (c !== '\r') cur += c;
  }
  if (cur || row.length){ row.push(cur); rows.push(row); }
  return rows;
}

    rows = rows.filter(r => r.some(c => String(c ?? '').trim()));
    const hi = rows.findIndex(r => r.filter(c => String(c ?? '').trim()).length >= 2);
    if (hi < 0 || rows.length <= hi + 1) throw new Error('Nem találtam fejlécet és adatsorokat a fájlban.');
    const headers = rows[hi].map(h => String(h ?? '').trim());
    imp = {fileName:file.name, headers, rows: rows.slice(hi + 1), map:{}, createPeople:true, update:false};
    // guess the column for each field: exact name first, then partial match
    const clean = h => norm(h).replace(/\*/g, '').trim(), used = new Set();
    for (const exact of [true, false]) for (const f of IMPORT_FIELDS){
      if (imp.map[f.key] >= 0) continue;
      let i = -1;
      // aliases are in priority order (e.g. "Notes" beats "Name" for the note field)
      for (const a of f.aliases){
        i = headers.findIndex((h, j) => !used.has(j) && (exact ? clean(h) === norm(a) : a.length > 4 && clean(h).includes(norm(a))));
        if (i >= 0) break;
      }
      imp.map[f.key] = i; if (i >= 0) used.add(i);
    }
    render();
  } catch(e){ alert('Nem sikerült beolvasni: ' + e.message); }
}
function findDeskByText(t){
  const [a, b] = t.split(/\s*[/›>]\s*/);
  if (!b) return null;
  const r = db.rooms.find(r => norm(r.name).startsWith(norm(a))) || db.rooms.find(r => norm(r.name).includes(norm(a)));
  return r && db.desks.find(k => k.roomId === r.id && norm(k.label) === norm(b)) || null;
}
function resolveHolder(text, email, loc){
  const byMail = email && db.people.find(p => p.email && norm(p.email) === norm(email));
  if (byMail) return {h:{kind:'person', id:byMail.id}};
  if (!text || /^(raktar|storage|-)$/.test(norm(text))){
    const k = loc && findDeskByText(loc);
    return k ? {h:{kind:'desk', id:k.id}, usedLoc:true} : {h:{kind:'storage'}};
  }
  const p = db.people.find(p => norm(p.name) === norm(text) || (p.email && norm(p.email) === norm(text)));
  if (p) return {h:{kind:'person', id:p.id}};
  const k = findDeskByText(text);
  if (k) return {h:{kind:'desk', id:k.id}};
  if (imp.createPeople) return {newPerson:{name:text, email:email || ''}};
  return {h:{kind:'storage'}, unknown:text};
}
function planImport(){
  const seen = new Set();
  return imp.rows.map(r => {
    const s = k => { const i = imp.map[k]; return i >= 0 ? String(r[i] ?? '').trim() : ''; };
    const raw = k => { const i = imp.map[k]; return i >= 0 ? r[i] : ''; };
    let model = s('model');
    const man = s('manufacturer');
    if (man && !norm(model).startsWith(norm(man))) model = (man + ' ' + model).trim();
    const type = parseType(s('type'), model), arrived = toISO(raw('arrived'));
    let warrantyUntil = toISO(raw('warrantyUntil'));
    const months = parseInt(s('warrantyMonths'), 10);
    if (!warrantyUntil && months && arrived){ const d = new Date(arrived); d.setMonth(d.getMonth() + months); warrantyUntil = isoLocal(d); }
    const tag = s('tag'), loc = s('location');
    const existing = tag && db.assets.find(a => norm(a.tag) === norm(tag));
    const holder = resolveHolder(s('holder'), s('email'), loc);
    const note = [s('note'), loc && !holder.usedLoc ? 'Hely (import): ' + loc : '', holder.unknown ? 'Kinél (import): ' + holder.unknown : ''].filter(Boolean).join('\n');
    let action = existing ? (imp.update ? 'update' : 'skip') : 'new';
    if (tag && seen.has(norm(tag))) action = 'dup';
    if (tag) seen.add(norm(tag));
    if (!tag && !model && !s('serial')) action = 'empty';
    return {tag, type, model, serial:s('serial'), status:parseStatus(s('status')), holder, arrived, warrantyUntil,
      supplier:s('supplier'), orderNo:s('orderNo'), ports:parseInt(s('ports'), 10) || null, note, existing, action};
  });
}
const planWhere = p => p.holder.newPerson ? `👤 ${p.holder.newPerson.name} (új személy)` : holderText(p.holder.h) + (p.holder.unknown ? ` (ismeretlen: ${p.holder.unknown})` : '');
const PLAN_LABEL = {new:'<span class="pill ok">Új</span>', update:'<span class="pill warn">Frissít</span>', skip:'<span class="pill">Kihagy – már létezik</span>', dup:'<span class="pill bad">Kihagy – dupla ID</span>', empty:'<span class="pill">Üres sor</span>'};
function runImport(){
  const plan = planImport(), people = new Map();
  let created = 0, updated = 0, skipped = 0;
  for (const p of plan){
    if (p.action !== 'new' && p.action !== 'update'){ skipped++; continue; }
    let h = p.holder.h;
    if (p.holder.newPerson){
      const k = norm(p.holder.newPerson.name);
      let np = people.get(k);
      if (!np){ np = {id:uid(), name:p.holder.newPerson.name, email:p.holder.newPerson.email, dept:'', mode:'iroda', note:'Importálva: ' + imp.fileName}; db.people.push(np); people.set(k, np); }
      h = {kind:'person', id:np.id};
    }
    const fields = {type:p.type, model:p.model, serial:p.serial, status:p.status, arrived:p.arrived, warrantyUntil:p.warrantyUntil,
      supplier:p.supplier, orderNo:p.orderNo, ports:isNet(p.type) ? p.ports : null, note:p.note};
    if (p.action === 'update'){
      // only overwrite what the file actually fills in
      for (const [k, v] of Object.entries(fields)) if (v !== '' && v !== null) p.existing[k] = v;
      setHolder(p.existing, h); log(p.existing.id, 'Frissítve importból: ' + imp.fileName); updated++;
    } else {
      const a = {id:uid(), tag:p.tag || nextTag(p.type), ...fields, status:p.status || 'ok', holder:h, created:Date.now(), assignedAt:h.kind === 'storage' ? null : Date.now()};
      const twin = a.model && db.assets.find(x => x.imageId && norm(x.model) === norm(a.model));
      if (twin) a.imageId = twin.imageId;
      db.assets.push(a); log(a.id, `Importálva (${imp.fileName}) – ${holderText(h)}`); created++;
    }
  }
  save();
  alert(`Import kész.\n\nÚj eszköz: ${created}\nFrissítve: ${updated}\nKihagyva: ${skipped}\nÚj személy: ${people.size}`);
  imp = null; location.hash = '#/assets';
}

// waits ms, honouring pause; `plain` waits are part of an action and do not move the progress bar
async function tsleep(ms, plain){
  for (let t = 0; t < ms;){
    if (tour.stopped || tour.skip) return;
    await new Promise(r => setTimeout(r, 100));
    if (!tour.paused){ t += 100; if (!plain) $('#tour .tp i').style.width = Math.min(100, t / ms * 100) + '%'; }
  }
}

  hideTourDoc();
  const d = document.createElement('div'); d.id = 'tourDoc';
  const f = document.createElement('iframe'); f.srcdoc = html; d.appendChild(f);
  document.body.appendChild(d); tourTop();
}
function hideTourDoc(){ const d = $('#tourDoc'); if (d) d.remove(); }
// keep the caption above modal dialogs (both live in the browser's top layer)
function tourTop(){ const el = $('#tour'); if (!el) return; try { if (el.matches(':popover-open')) el.hidePopover(); el.showPopover(); } catch(e) {} }
function tourUI(){
  const el = document.createElement('div');
  el.id = 'tour'; el.setAttribute('popover', 'manual');
  el.innerHTML = `<div class="tn"></div><h4></h4><div class="tt"></div><div class="tp"><i></i></div>
    <div class="tc"><button data-t="pause">⏸ Szünet</button><button data-t="next">⏭ Következő</button><button data-t="stop">✕ Kilépés</button>
    <span style="margin-left:auto">Szóköz: szünet · →: tovább · Esc: kilépés</span></div>`;
  el.addEventListener('click', e => { const b = e.target.closest('[data-t]'); if (b) tourCmd(b.dataset.t); });
  document.body.appendChild(el); tourTop();
}
function tourCmd(c){
  if (c === 'pause'){ tour.paused = !tour.paused; const b = document.querySelector('#tour [data-t=pause]'); if (b) b.textContent = tour.paused ? '▶ Folytatás' : '⏸ Szünet'; }
  if (c === 'next') tour.skip = true;
  if (c === 'stop') tour.stopped = true;
}
document.addEventListener('keydown', e => {
  if (!tour.on) return;
  if (e.key === ' ' && e.target.tagName !== 'TEXTAREA' && e.target.tagName !== 'INPUT'){ e.preventDefault(); tourCmd('pause'); }
  else if (e.key === 'ArrowRight') tourCmd('next');
  else if (e.key === 'Escape'){ e.preventDefault(); tourCmd('stop'); }
});
async function startTour(){
  if (tour.on) return;
  if (!confirm('Indul az automatikus bemutató (kb. 2 perc) mintaadatokkal.\nA saját adataid nem vesznek el – a bemutató végén visszaállnak.')) { if (location.hash === '#/tour') location.hash = '#/'; return; }
  try { const cur = localStorage.getItem(KEY); localStorage.setItem(TOUR_BACKUP, cur === null ? '__none__' : cur); } catch(e) {}
  Object.assign(tour, {on:true, paused:false, stopped:false, skip:false, confirm:window.confirm, alert:window.alert});
  // the scripted steps answer the app's own prompts
  window.confirm = () => true; window.alert = () => {};
  if ($('#dlg').open) $('#dlg').close();
  db = demo(); save(); imp = null;
  tourUI();
  for (tour.i = 0; tour.i < TOUR.length && !tour.stopped; tour.i++){
    const s = TOUR[tour.i];
    tour.skip = false;
    hideTourDoc();
    document.querySelectorAll('.tour-hl').forEach(x => x.classList.remove('tour-hl'));
    $('#results').classList.remove('show'); $('#q').value = ''; $('#q').blur();
    if (s.go){
      if ($('#dlg').open) $('#dlg').close();
      const h = typeof s.go === 'function' ? s.go() : s.go;
      if (location.hash !== h) location.hash = h; else render();
      await new Promise(r => setTimeout(r, 350));
    }
    const box = $('#tour');
    box.querySelector('.tn').textContent = `${tour.i + 1} / ${TOUR.length}`;
    box.querySelector('h4').textContent = s.title;
    box.querySelector('.tt').textContent = s.text;
    box.querySelector('.tp i').style.width = '0';
    try { if (s.act) await s.act(); } catch(e) { console.warn('Bemutató lépés hiba:', e); }
    await new Promise(r => setTimeout(r, 150));
    const target = typeof s.hl === 'function' ? s.hl() : s.hl && document.querySelector(s.hl);
    if (target){ target.classList.add('tour-hl'); target.scrollIntoView({block:'center', inline:'nearest', behavior:'smooth'}); }
    await tsleep(s.ms);
  }
  endTour();
}
function endTour(){
  window.confirm = tour.confirm; window.alert = tour.alert;
  hideTourDoc();
  document.querySelectorAll('.tour-hl').forEach(x => x.classList.remove('tour-hl'));
  if ($('#dlg').open) $('#dlg').close();
  const el = $('#tour'); if (el) el.remove();
  imp = null; selected.clear();
  restoreTourBackup();
  db = load();
  tour.on = false;
  if (location.hash === '#/') render(); else location.hash = '#/';
}

// ---------- global search ----------
function search(q){
  const n = norm(q.trim()); if (!n) return [];
  const out = [];
  for (const p of db.people) if (norm([p.name, p.email, p.dept].join(' ')).includes(n)){
    const pa = personAssets(p.id);
    out.push({grp:'Emberek', href:'#/person/' + p.id, title:'👤 ' + p.name, sub:`${p.dept} · ${MODES[p.mode]} · ${pa.direct.length + pa.onDesk.length} eszköz`});
  }
  for (const a of db.assets) if (norm([a.tag, a.serial, a.model, typeLabel(a.type), a.note, a.orderNo].join(' ')).includes(n))
    out.push({grp:'Eszközök', href:'#/asset/' + a.id, title:`${typeIcon(a.type)} ${a.tag} · ${a.model}`, sub: holderText(a.holder)});
  for (const k of db.desks){ const r = room(k.roomId); if (norm(k.label + ' ' + (r ? r.name : '') + ' ' + (k.sharedNote || '')).includes(n))
    out.push({grp:'Asztalok / rackek', href:`#/room/${k.roomId}/${k.id}`, title:`${furnIcon(k)} ${k.label}`, sub:(r ? r.name : '') + (deskOwnerText(k) ? ' – ' + deskOwnerText(k) : '')}); }
  for (const p of netPorts()){ const sw = p.switchId && asset(p.switchId); if (norm([p.label, p.note, sw ? sw.tag + '/' + p.switchPort : ''].join(' ')).includes(n))
    out.push({grp:'Hálózati pontok', href:`#/room/${p.roomId}/${p.id}`, title:'🌐 ' + p.label, sub:`${(room(p.roomId) || {}).name || ''} · ${portTarget(p)} · ${p.patched ? 'bepatchelve' : 'nincs patchelve'}`}); }
  for (const b of db.items) if (b.kind === 'floorbox' && norm(b.label + ' ' + (b.note || '')).includes(n))
    out.push({grp:'Padlódobozok', href:`#/room/${b.roomId}/${b.id}`, title:'▦ ' + b.label, sub:`${(room(b.roomId) || {}).name || ''} · ${boxPorts(b.id).length} hálózati pont`});
  for (const r of db.rooms) if (norm(r.name + ' ' + r.floor).includes(n))
    out.push({grp:'Helyiségek', href:'#/room/' + r.id, title:(ROOM_KINDS[r.kind] || '🏢').split(' ')[0] + ' ' + r.name, sub:r.floor});
  return out.slice(0, 40);
}
let resIdx = 0;
function showResults(){
  const box = $('#results');
  const list = search($('#q').value); resIdx = 0;
  if (!$('#q').value.trim()){ box.classList.remove('show'); return; }
  let grp = '';
  box.innerHTML = list.length ? list.map((r, i) => {
    const g = r.grp !== grp ? `<div class="grp">${grp = r.grp}</div>` : '';
    return g + `<a href="${r.href}" data-i="${i}"${i === 0 ? ' class="act"' : ''}>${esc(r.title)}<small>${esc(r.sub)}</small></a>`;
  }).join('') : '<div class="empty">Nincs találat.</div>';
  box.classList.add('show');
}
$('#q').addEventListener('input', showResults);
$('#q').addEventListener('focus', showResults);
$('#q').addEventListener('keydown', e => {
  const links = [...$('#results').querySelectorAll('a')];
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp'){
    e.preventDefault(); if (!links.length) return;
    resIdx = (resIdx + (e.key === 'ArrowDown' ? 1 : -1) + links.length) % links.length;
    links.forEach((l, i) => l.classList.toggle('act', i === resIdx)); links[resIdx].scrollIntoView({block:'nearest'});
  } else if (e.key === 'Enter' && links[resIdx]){ location.hash = links[resIdx].getAttribute('href'); closeSearch(); }
  else if (e.key === 'Escape') closeSearch();
});
$('#results').addEventListener('click', e => { if (e.target.closest('a')) closeSearch(); });
document.addEventListener('click', e => { if (!e.target.closest('.search')) $('#results').classList.remove('show'); });
document.addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k'){ e.preventDefault(); $('#q').focus(); $('#q').select(); } });
function closeSearch(){ $('#results').classList.remove('show'); $('#q').value = ''; $('#q').blur(); }

// ---------- router ----------
let lastRoute = '';
function render(){
  const raw = location.hash.replace(/^#\/?/, '');
  const [path, qs] = raw.split('?');
  const parts = path.split('/').filter(Boolean);
  const params = new URLSearchParams(qs || '');
  const r = parts[0] || '';
  const v = $('#view');
  // flash the object once when arriving from somewhere else (e.g. from an asset page)
  flashObj = r === 'room' && parts[2] && !lastRoute.startsWith('room/' + parts[1]) ? parts[2] : null;
  if (path !== lastRoute) selected.clear();
  lastRoute = path;
  document.querySelectorAll('#nav a').forEach(a => {
    const map = {asset:'assets', person:'people', room:'rooms', import:'assets'};
    a.classList.toggle('on', a.dataset.r === (map[r] || r));
  });
  switch (r){
    case 'assets': v.innerHTML = viewAssets(params); bindAssetFilters(); break;
    case 'asset': v.innerHTML = viewAsset(parts[1]); break;
    case 'people': v.innerHTML = viewPeople(); break;
    case 'person': v.innerHTML = viewPerson(parts[1]); break;
    case 'rooms': v.innerHTML = viewRooms(); break;
    case 'room': v.innerHTML = viewRoom(parts[1], parts[2]); if (room(parts[1])) bindRoom(parts[1], parts[2]); break;
    case 'network': v.innerHTML = viewNetwork(params);
      $('#nf').addEventListener('change', e => { location.hash = '#/network' + (e.target.value ? '?f=' + e.target.value : ''); }); break;
    case 'docs': v.innerHTML = viewDocs(params);
      $('#df').addEventListener('change', e => { location.hash = '#/docs' + (e.target.value ? '?f=' + e.target.value : ''); }); break;
    case 'import': v.innerHTML = viewImport(); bindImport(); break;
    case 'tour': v.innerHTML = viewDashboard(); setTimeout(startTour, 300); break;
    case 'log': v.innerHTML = viewLog(); break;
    case 'settings': v.innerHTML = viewSettings(); break;
    default: v.innerHTML = viewDashboard();
  }
  updateBulk();
  if (flashObj){ const el = document.querySelector(`.obj[data-id="${flashObj}"]`); if (el) el.scrollIntoView({block:'center', inline:'center'}); }
}
window.addEventListener('hashchange', render);
// sticky bars sit below the (wrapping) header
const setHdr = () => document.documentElement.style.setProperty('--hdr', document.querySelector('header').offsetHeight + 'px');
window.addEventListener('resize', setHdr); setHdr();
// keep tabs in sync if the app is open in several tabs
window.addEventListener('storage', e => { if (e.key === KEY){ db = load(); render(); } });
render();
</script>
