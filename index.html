<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TC IT Asset Management</title>
<link rel="stylesheet" href="css/app.css">
<script>try { document.documentElement.dataset.nav = localStorage.getItem('itraktar_nav') || 'open'; } catch(e) {}</script>
</head>
<body>
<aside id="side" aria-label="Main navigation">
  <div class="brand"><span id="brandLogo">🗄️</span><span class="lbl">TC IT Asset Management</span></div>
  <nav id="nav">
    <div class="ngrp">Dashboard</div>
    <a href="#/" data-r="" title="Overview"><i>📊</i><span class="lbl">Overview</span></a>
    <div class="ngrp">Inventory</div>
    <a href="#/assets" data-r="assets" title="Assets"><i>💻</i><span class="lbl">Assets</span></a>
    <a href="#/people" data-r="people" title="People"><i>👥</i><span class="lbl">People</span></a>
    <a href="#/rooms" data-r="rooms" title="Floorplan"><i>🗺️</i><span class="lbl">Floorplan</span></a>
    <div class="ngrp">Operations</div>
    <a href="#/projects" data-r="projects" title="Projects"><i>📋</i><span class="lbl">Projects</span></a>
    <a href="#/docs" data-r="docs" title="Documents"><i>📄</i><span class="lbl">Documents</span></a>
    <a href="#/log" data-r="log" title="Logs"><i>🕘</i><span class="lbl">Logs</span></a>
    <div class="ngrp">Administration</div>
    <a href="#/settings" data-r="settings" title="Settings"><i>⚙️</i><span class="lbl">Settings</span></a>
    <a href="#/admin" data-r="admin" title="Admin Panel"><i>🔐</i><span class="lbl">Admin Panel</span></a>
  </nav>
  <button id="navMini" class="sm" onclick="setNav(document.documentElement.dataset.nav === 'mini' ? 'open' : 'mini')" title="Collapse to icons"></button>
</aside>
<div id="mainCol">
<header>
  <button id="navToggle" onclick="toggleNav()" aria-controls="side" title="Show or hide the menu">☰</button>
  <div class="search">
    <input id="q" type="search" placeholder="Search: name, Asset ID, serial, desk, port, ticket, project… (Ctrl+K)" autocomplete="off" aria-label="Global search">
    <div id="results" class="results"></div>
  </div>
  <div class="topright">
    <div id="scopeBar"></div>
    <button class="primary sm" onclick="startTour()" title="Automatic tour of the features">▶ Tour</button>
    <button id="themeBtn" class="sm" onclick="toggleTheme()" title="Light / dark mode"></button>
    <a class="btn sm" id="userChip" href="#/settings/user" title="Active account"></a>
  </div>
</header>
<main id="view"></main>
</div>
<div id="navShade" onclick="setNav('hidden')"></div>
<dialog id="dlg"><form method="dialog" id="dlgForm"></form></dialog>
<input type="file" id="importFile" accept=".json,application/json" hidden>

<!-- Serverless prototype: the order matters (data → ui → modules → app) -->
<script src="js/data.js"></script>
<script src="js/ui.js"></script>
<script src="js/xlsx.js"></script>
<script src="js/docs.js"></script>
<script src="js/assets.js"></script>
<script src="js/overview.js"></script>
<script src="js/people.js"></script>
<script src="js/floorplan.js"></script>
<script src="js/projects.js"></script>
<script src="js/labels.js"></script>
<script src="js/settings.js"></script>
<script src="js/patchnotes.js"></script>
<script src="js/doctpl.js"></script>
<script src="js/tour.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
</body>
</html>
