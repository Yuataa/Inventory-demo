<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IT Raktár</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header>
  <div class="brand">🗄️ IT Raktár</div>
  <nav id="nav">
    <a href="#/" data-r="">Áttekintés</a>
    <a href="#/assets" data-r="assets">Eszközök</a>
    <a href="#/people" data-r="people">Emberek</a>
    <a href="#/rooms" data-r="rooms">Floorplan</a>
    <a href="#/projects" data-r="projects">Projects</a>
    <a href="#/docs" data-r="docs">Dokumentumok</a>
    <a href="#/log" data-r="log">Logs</a>
    <a href="#/settings" data-r="settings">Settings</a>
  </nav>
  <button class="primary" onclick="startTour()" title="Automatikus bemutató a funkciókról">▶ Bemutató</button>
  <a class="btn sm" id="userChip" href="#/settings/user" title="A naplóban megjelenő név"></a>
  <div class="search">
    <input id="q" type="search" placeholder="Keresés: név, Asset ID, sorozatszám, asztal, port, projekt… (Ctrl+K)" autocomplete="off">
    <div id="results" class="results"></div>
  </div>
</header>
<main id="view"></main>
<dialog id="dlg"><form method="dialog" id="dlgForm"></form></dialog>
<input type="file" id="importFile" accept=".json,application/json" hidden>

<!-- Szerver nélküli prototípus: a sorrend számít (data → ui → modulok → app) -->
<script src="js/data.js"></script>
<script src="js/ui.js"></script>
<script src="js/docs.js"></script>
<script src="js/assets.js"></script>
<script src="js/people.js"></script>
<script src="js/floorplan.js"></script>
<script src="js/projects.js"></script>
<script src="js/settings.js"></script>
<script src="js/tour.js"></script>
<script src="js/app.js"></script>
</body>
</html>
